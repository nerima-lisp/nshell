name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run the native flake checks for this runner. Granularity belongs in the
  # flake's `checks.*` attributes, where Nix can share build results.
  # The additional Linux jobs below cover real-PTY integration, coverage
  # artifact upload, and binary execution outside the sandbox.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # Builds every check declared for this runner's native system.
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  integration:
    # NOT movable into `checks.*`: this runs the FULL suite in a dev shell
    # rather than the hermetic Nix sandbox, so the cases `nix flake check`
    # skips — the ones needing a real PTY, `stty`, /bin/cat and other external
    # processes — get genuine coverage on a runner where those facilities
    # exist. The sandbox has no controlling terminal, so there is nothing for
    # those tests to attach to.
    # Keep the real-PTY integration suite on this single Linux runner.
    name: integration tests (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # The t/golden cases run the built binary with the fixed bin on PATH;
      # with CI set, a missing NSHELL_BIN or NSHELL_SPEC_BIN_DIR fails them.
      - name: Build the nshell binary and the golden fixed bin
        run: |
          nix build .#default --print-build-logs --out-link "$RUNNER_TEMP/nshell-bin"
          nix build .#spec-bin --print-build-logs --out-link "$RUNNER_TEMP/nshell-spec-bin"

      - name: Run full test suite in a dev shell (non-sandboxed)
        env:
          HOME: ${{ runner.temp }}/nshell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/nshell-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/nshell-config
          XDG_STATE_HOME: ${{ runner.temp }}/nshell-state
          NSHELL_AI_COMMAND: /nonexistent
          NSHELL_TEST_PTY: "1"
          NSHELL_BIN: ${{ runner.temp }}/nshell-bin/bin/nshell
          NSHELL_SPEC_BIN_DIR: ${{ runner.temp }}/nshell-spec-bin/bin
        run: nix develop -c sbcl --script run-tests.lisp

      - name: Verify dependency suites and private history storage
        env:
          HOME: ${{ runner.temp }}/nshell-dependency-home
          XDG_CACHE_HOME: ${{ runner.temp }}/nshell-dependency-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/nshell-dependency-config
          XDG_STATE_HOME: ${{ runner.temp }}/nshell-dependency-state
          NSHELL_AI_COMMAND: /nonexistent
          NSHELL_TEST_PTY: "1"
        run: |
          nix develop -c bash scripts/test-dependencies.sh
          nix develop -c perl t/scripts/test-dependencies.pl
          nix develop -c sbcl --script t/scripts/test-dependency-assertions.lisp
          nix develop -c sbcl --script scripts/test-history-storage.lisp

  no-nix:
    name: no-Nix full suite (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 2.6.10 removed sb-unix:unix-ioctl, which cl-tty-kit still requires.
      - name: Install SBCL 2.6.9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sbcl-2.6.9-x86-64-linux-binary.tar.bz2"
          distribution="$RUNNER_TEMP/sbcl-2.6.9-x86-64-linux"
          install_root="$RUNNER_TEMP/nshell-sbcl"
          curl --fail --location --silent --show-error --retry 3 \
            "https://downloads.sourceforge.net/project/sbcl/sbcl/2.6.9/sbcl-2.6.9-x86-64-linux-binary.tar.bz2" \
            --output "$archive"
          printf '%s  %s\n' \
            '39fac28407405841003e4c2abfbe0d96abd93b7701e8b61cdd35e713943b46d6' \
            "$archive" | sha256sum --check -
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          cd "$distribution"
          INSTALL_ROOT="$install_root" sh ./install.sh
          printf '%s\n' "$install_root/bin" >> "$GITHUB_PATH"
          printf 'SBCL_HOME=%s\n' "$install_root/lib/sbcl" >> "$GITHUB_ENV"
          version="$(SBCL_HOME="$install_root/lib/sbcl" "$install_root/bin/sbcl" --version)"
          printf '%s\n' "$version"
          [[ "$version" == *"2.6.9"* ]]

      - name: Run Nix-free full test suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/bootstrap-without-nix.sh

  coverage:
    # Keep coverage separate from the integration gate: the report instrumented
    # run is slower and writes generated files, while integration remains the
    # smallest readable behavioural gate.
    name: source coverage (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # The t/golden cases run the built binary with the fixed bin on PATH;
      # with CI set, a missing NSHELL_BIN or NSHELL_SPEC_BIN_DIR fails them.
      - name: Build the nshell binary and the golden fixed bin
        run: |
          nix build .#default --print-build-logs --out-link "$RUNNER_TEMP/nshell-bin"
          nix build .#spec-bin --print-build-logs --out-link "$RUNNER_TEMP/nshell-spec-bin"

      - name: Generate source coverage report
        env:
          HOME: ${{ runner.temp }}/nshell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/nshell-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/nshell-config
          XDG_STATE_HOME: ${{ runner.temp }}/nshell-state
          NSHELL_AI_COMMAND: /nonexistent
          NSHELL_BIN: ${{ runner.temp }}/nshell-bin/bin/nshell
          NSHELL_SPEC_BIN_DIR: ${{ runner.temp }}/nshell-spec-bin/bin
        run: |
          coverage_dir="$RUNNER_TEMP/nshell-coverage"
          mkdir -p "$coverage_dir"
          NSHELL_COVERAGE_DIR="$coverage_dir" nix develop -c sbcl --script scripts/coverage.lisp
          test -s "$coverage_dir/coverage-summary.json"
          perl -0777 -ne '
            die "coverage summary schema is incomplete\n"
              unless /"expression-percent"\s*:\s*[0-9.]+/
                 && /"tests-selected"\s*:\s*[1-9][0-9]*/
                 && /"tests-passed"\s*:\s*true/
                 && /"minimum-passed"\s*:\s*true/
                 && /"target-reached"\s*:\s*(?:true|false)/;
            print "coverage summary schema verified\n";
          ' "$coverage_dir/coverage-summary.json"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nshell-coverage
          path: ${{ runner.temp }}/nshell-coverage
          if-no-files-found: error
          retention-days: 14

  binary:
    # NOT movable into `checks.*`: this confirms the dumped SBCL executable
    # actually starts and runs a command outside the build sandbox. A
    # derivation that builds the image proves it links; only running it proves
    # `save-lisp-and-die`'s toplevel and saved runtime options survived.
    #
    # One Linux runner, no matrix. Release artifacts are built on Linux.
    name: build release binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Build release bundle
        run: nix build .#releaseBundle --print-build-logs

      - name: Verify release PTY harness regressions
        run: perl t/scripts/test-release-pty.pl

      - name: Verify release bundle
        run: perl scripts/verify-release-bundle.pl result

      - name: Verify extracted release bundle with a real PTY
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nshell-ci.tar.gz"
          tar -czf "$archive" -C result .
          extracted="$(mktemp -d "$RUNNER_TEMP/nshell-ci.XXXXXX")"
          tar -xzf "$archive" -C "$extracted"
          perl scripts/verify-release-bundle.pl "$extracted"
          perl scripts/test-release-pty.pl "$extracted"
