name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One Linux job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, or artifact upload. "A different runner OS" is no longer
  # one of them: the flake's aarch64-darwin target is for local development,
  # while the Linux target is the hosted release and integration gate. The two
  # extra jobs below still qualify; see the comment on each.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # Runs the SBCL test suite (checks.default), the cl-weave completion
      # suite (checks.weave), the treefmt formatting gate (checks.formatting),
      # the mkdocs --strict build (checks.docs), and the binary smoke test.
      #
      # No `--all-systems`: this hosted job is the Linux gate. The Darwin target
      # is intentionally evaluated on its native development platform rather
      # than realised as a foreign derivation on this runner.
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  integration:
    # NOT movable into `checks.*`: this runs the FULL suite in a dev shell
    # rather than the hermetic Nix sandbox, so the cases `nix flake check`
    # skips — the ones needing a real PTY, `stty`, /bin/cat and other external
    # processes — get genuine coverage on a runner where those facilities
    # exist. The sandbox has no controlling terminal, so there is nothing for
    # those tests to attach to.
    # One runner, no matrix: aarch64-darwin (macos-14) used to carry this leg
    # too, but its runs were unreliable enough under CI load to be worse than
    # no coverage. x86_64-linux is what CI gates; aarch64-darwin remains the
    # local development target (see flake.nix), just without a CI leg here.
    name: integration tests (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run full test suite in a dev shell (non-sandboxed)
        run: nix develop --command sbcl --script run-tests.lisp

  coverage:
    # Keep coverage separate from the integration gate: the report instrumented
    # run is slower and writes generated files, while integration remains the
    # smallest readable behavioural gate.
    name: source coverage (x86_64-linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Generate source coverage report
        run: |
          coverage_dir="$RUNNER_TEMP/nshell-coverage"
          mkdir -p "$coverage_dir"
          NSHELL_COVERAGE_DIR="$coverage_dir" nix develop --command sbcl --script scripts/coverage.lisp
          test -s "$coverage_dir/coverage-summary.json"
          perl -0777 -ne '
            die "coverage summary schema is incomplete\n"
              unless /"expression-percent"\s*:\s*[0-9.]+/
                 && /"tests-selected"\s*:\s*[1-9][0-9]*/
                 && /"tests-passed"\s*:\s*true/
                 && /"minimum-passed"\s*:\s*true/
                 && /"target-reached"\s*:\s*(?:true|false)/;
            print "coverage summary schema verified\n";
          ' "$coverage_dir/coverage-summary.json"

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nshell-coverage
          path: ${{ runner.temp }}/nshell-coverage
          if-no-files-found: error
          retention-days: 14

  binary:
    # NOT movable into `checks.*`: this confirms the dumped SBCL executable
    # actually starts and runs a command outside the build sandbox. A
    # derivation that builds the image proves it links; only running it proves
    # `save-lisp-and-die`'s toplevel and saved runtime options survived.
    #
    # One Linux runner, no matrix. The aarch64-darwin target is for local
    # development; release artifacts are intentionally built on Linux.
    name: build release binary
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Build release bundle
        run: nix build .#releaseBundle --print-build-logs

      - name: Verify release bundle
        run: perl scripts/verify-release-bundle.pl result
