name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, artifact upload, or a different runner OS. The two extra
  # jobs below qualify; see the comment on each.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # Runs the SBCL test suite (checks.default), the cl-weave completion
      # suite (checks.weave), the treefmt formatting gate (checks.formatting),
      # the mkdocs --strict build (checks.docs), and the binary smoke test.
      #
      # Build checks for this runner's native system. The integration and
      # release-bundle jobs below exercise both declared systems natively.
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  integration:
    # NOT movable into `checks.*`: this runs the FULL suite in a dev shell
    # rather than the hermetic Nix sandbox, so the cases `nix flake check`
    # skips — the ones needing a real PTY, `stty`, /bin/cat and other external
    # processes — get genuine coverage on a runner where those facilities
    # exist. The sandbox has no controlling terminal, so there is nothing for
    # those tests to attach to.
    name: integration tests (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-14
            target: aarch64-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run full test suite in a dev shell (non-sandboxed)
        run: nix develop --command sbcl --script run-tests.lisp

  binary:
    # NOT movable into `checks.*`: this verifies the exact portable bundle
    # shipped by the release workflow, including its launcher, runtime
    # libraries, notices, dependency closure, and out-of-store execution.
    #
    # The matrix tracks the flake's `systems`. macos-13 (x86_64-darwin) was
    # dropped alongside that platform's removal from `systems` (ADR-0078):
    # `nix build` there would now fail on a missing attribute.
    name: verify release bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # x86_64-linux
          - os: macos-14 # aarch64-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ github.event_name != 'pull_request' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Build release bundle
        run: nix build .#releaseBundle --print-build-logs

      - name: Verify release bundle
        run: perl scripts/verify-release-bundle.pl result
