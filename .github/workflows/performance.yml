name: NFR performance measurements

on:
  workflow_dispatch:
    inputs:
      nfr:
        description: NFR IDs to measure (all or comma-separated values from 01 through 09)
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: nshell-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: measure (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Validate NFR selection
        id: nfr-selection
        env:
          NFR_SELECTION: ${{ inputs.nfr }}
        run: python3 scripts/nfr_selection.py "$NFR_SELECTION" --github-output "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}

      - name: Verify native runner
        run: |
          test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
          case "${{ matrix.system }}" in
            aarch64-darwin) test "$(uname -m)" = arm64 ;;
            x86_64-linux) test "$(uname -m)" = x86_64 ;;
          esac

      - name: Build nshell
        id: binary
        if: steps.nfr-selection.outputs.requires_binary == 'true'
        run: >-
          nix build --max-jobs 1 --print-build-logs
          ".#packages.${{ matrix.system }}.default"
          --out-link "$RUNNER_TEMP/nshell-nfr-binary"

      - name: Measure NFR-01 through NFR-07
        if: steps.nfr-selection.outputs.measures_01_07 == 'true'
        run: >-
          nix develop .#scenarios -c python3
          scripts/measure-nfr-ci.py
          --binary "$RUNNER_TEMP/nshell-nfr-binary/bin/nshell"
          --output-dir "$RUNNER_TEMP/nshell-nfr-results"
          --system "${{ matrix.system }}"
          --revision "$GITHUB_SHA"
          --nfrs "${{ steps.nfr-selection.outputs.selected }}"

      - name: Diagnose NFR-05 redraw stages and native waits
        if: ${{ always() && !cancelled() && steps.binary.outcome == 'success' }}
        env:
          NFR05_DIAGNOSTIC_BINARY: ${{ runner.temp }}/nshell-nfr-binary/bin/nshell
          NFR05_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/nshell-nfr-results/nfr05-diagnostics
        run: |
          if [ "${{ matrix.system }}" = "x86_64-linux" ] && ! command -v strace >/dev/null; then
            if sudo -n apt-get update && sudo -n apt-get install -y strace; then
              echo "Installed strace for the isolated NFR-05 native capture."
            else
              echo "strace installation unavailable; stage diagnostics will still be collected." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          nix develop .#scenarios -c python3 scripts/measure-nfr05-diagnostics.py \
            --binary "$NFR05_DIAGNOSTIC_BINARY" \
            --output-dir "$NFR05_DIAGNOSTIC_OUTPUT"

      - name: Upload NFR-05 diagnostic pass
        if: ${{ always() && !cancelled() && steps.binary.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nshell-nfr05-diagnostics-${{ matrix.system }}
          path: ${{ runner.temp }}/nshell-nfr-results/nfr05-diagnostics
          if-no-files-found: warn
          retention-days: 90

      - name: Profile NFR-06 CPU
        if: ${{ always() && !cancelled() && steps.binary.outcome == 'success' && steps.nfr-selection.outputs.nfr_06 == 'true' }}
        env:
          NFR06_PROFILE_BINARY: ${{ runner.temp }}/nshell-nfr-binary/bin/nshell
          NFR06_PROFILE_FIXTURE: ${{ runner.temp }}/nshell-nfr06-fixture
          NFR06_PROFILE_OUTPUT: ${{ runner.temp }}/nshell-nfr-results/nfr06-profile
        run: >-
          nix develop .#scenarios -c python3
          scripts/profile-nfr06-ci.py
          --mode cpu --iterations 100

      - name: Measure E02 startup with 10,000 history records
        if: ${{ always() && steps.nfr-selection.outputs.all == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          logs="$GITHUB_WORKSPACE/.mediator/nshell-work/logs"
          results="$RUNNER_TEMP/nshell-nfr-results"
          mkdir -p "$logs" "$results"
          report="$logs/e02-history-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.system }}.json"

          set +e
          nix develop .#scenarios -c python3 scripts/measure-e02-history-startup.py \
            --binary "$RUNNER_TEMP/nshell-nfr-binary/bin/nshell" \
            --system "${{ matrix.system }}" \
            --output "$report"
          measure_status=$?
          set -e

          if [ -f "$report" ]; then
            cp "$report" "$results/e02-history-startup.json"
          fi
          shopt -s nullglob
          for artifact_dir in "$logs"/"e02-history-startup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.system }}-artifacts-"*; do
            cp -R "$artifact_dir" "$results/"
          done
          shopt -u nullglob
          exit "$measure_status"

      - name: Prepare NFR-09 revision history
        id: nfr09-history
        if: ${{ always() && steps.nfr-selection.outputs.nfr_09 == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          base_revision="$(git rev-parse "${GITHUB_SHA}^")"
          printf 'base_revision=%s\n' "$base_revision" >> "$GITHUB_OUTPUT"
          nix shell nixpkgs#jujutsu -c jj git init --colocate

      - name: Measure NFR-08
        if: ${{ always() && steps.nfr-selection.outputs.nfr_08 == 'true' }}
        run: >-
          nix develop .#scenarios -c python3
          scripts/measure-nfr-07-09.py
          --mode nfr08
          --fuzz-target reader
          --fuzz-target input-state
          --output "$RUNNER_TEMP/nshell-nfr-results/nfr-08.json"
          --revision "$GITHUB_SHA"

      - name: Measure NFR-09
        if: ${{ always() && steps.nfr-selection.outputs.nfr_09 == 'true' }}
        shell: bash
        env:
          BASE_REVISION: ${{ steps.nfr09-history.outputs.base_revision }}
          HOME: ${{ runner.temp }}/nshell-nfr09-home
          XDG_CACHE_HOME: ${{ runner.temp }}/nshell-nfr09-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/nshell-nfr09-config
          XDG_STATE_HOME: ${{ runner.temp }}/nshell-nfr09-state
          NSHELL_AI_COMMAND: /nonexistent
          NSHELL_TEST_PTY: "1"
        run: >-
          nix shell nixpkgs#jujutsu nixpkgs#python3 -c python3
          scripts/measure-nfr-07-09.py
          --mode nfr09
          --base-revision "$BASE_REVISION"
          --output "$RUNNER_TEMP/nshell-nfr-results/nfr-09.json"
          --revision "$GITHUB_SHA"

      - name: Publish NFR job summary
        if: always()
        env:
          NFR_SELECTION: ${{ steps.nfr-selection.outputs.selected }}
          NFR_ALL: ${{ steps.nfr-selection.outputs.all }}
        run: |
          summary="$RUNNER_TEMP/nshell-nfr-results/summary.md"
          results="$RUNNER_TEMP/nshell-nfr-results"
          mkdir -p "$results"
          if [ -z "$NFR_SELECTION" ]; then
            {
              echo "# NFR performance results"
              echo
              echo "NFR selection validation failed. No NFR measurements were requested."
            } > "$summary"
          elif [ ! -s "$summary" ]; then
            if [ "$NFR_ALL" = true ]; then
              {
                echo "# NFR-01 to NFR-09 performance results"
                echo
                echo "No complete NFR-01 to NFR-07 summary was produced. Inspect its build result and partial measurement artifacts."
              } > "$summary"
            else
              python3 - "$NFR_SELECTION" "$summary" <<'PY'
          import sys
          from pathlib import Path

          selected = tuple(sys.argv[1].split(","))
          selected_display = ", ".join(f"NFR-{nfr}" for nfr in selected)
          unmeasured = [f"NFR-{nfr}" for nfr in (f"{number:02d}" for number in range(1, 10)) if nfr not in selected]
          path = Path(sys.argv[2])
          path.write_text(
              "# Selected NFR performance results\n\n"
              f"Selected NFRs: {selected_display}.\n"
              f"Unselected NFRs were not measured: {', '.join(unmeasured) or 'none'}; E02 was not measured.\n\n"
              "Selected measurement summary was not produced. Inspect the build and selected measurement artifacts.\n",
              encoding="utf-8",
          )
          PY
            fi
          fi
          profile_root="$RUNNER_TEMP/nshell-nfr-results/nfr06-profile"
          profile_result=$(find "$profile_root" -path '*/gate-cpu-*/result.json' -type f -print -quit 2>/dev/null || true)
          if [ "$NFR_ALL" = true ] || [[ ",$NFR_SELECTION," == *,06,* ]]; then
            if [ -n "$profile_result" ]; then
              python3 - "$profile_result" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          counts = result.get("profile_sample_counts", {})
          print("\n## NFR-06 CPU profile")
          print(f"Status: **{result.get('status', 'unknown')}**")
          print(f"Iterations: {result.get('iterations_validated', 0)} / {result.get('iterations_requested', 0)}")
          print(f"Validated samples: {counts.get('raw_vector_trace_count', 'unavailable')} (graph {counts.get('graph_header_count', 'unavailable')}, thread CSV {counts.get('thread_counts_csv_total', 'unavailable')})")
          print(f"Completion-thread samples: {counts.get('target_thread_count', 'unavailable')}")
          print(f"Profile artifacts: `{result_path.parent}`")
          flat_path = Path(result.get("target_flat", result_path.parent / "cpu.target.flat.txt"))
          if flat_path.is_file():
              flat_rows = []
              for line in flat_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  fields = line.split()
                  if len(fields) > 8 and fields[0].isdigit():
                      flat_rows.append(line)
              print("\nTop completion-thread flat-profile functions:")
              print("\n```text")
              print("\n".join(flat_rows[:20]))
              print("```")
          PY
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "NFR-06 CPU profile did not produce a validated result; inspect the uploaded profile artifact." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          nix develop .#scenarios -c python3 - "$results" "$summary" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          results = Path(sys.argv[1])
          summary = Path(sys.argv[2])

          def read_report(filename):
              path = results / filename
              if not path.is_file():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  return None

          def operation(filename, name):
              report = read_report(filename)
              if report is None:
                  return None
              rows = report.get("operations")
              if not isinstance(rows, list):
                  return None
              return next((row for row in rows if row.get("name") == name), None)

          def status(row):
              if row is None:
                  return "ERROR"
              return {
                  "success": "PASS",
                  "fail": "FAIL",
                  "warning": "WARNING",
              }.get(row.get("status"), "ERROR")

          def number(value):
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  return f"{value:g}"
              return "unavailable"

          nfr08 = operation("nfr-08.json", "nfr08_fuzz")
          nfr08_counts = nfr08.get("counts") if nfr08 else None
          nfr08_counts = nfr08_counts if isinstance(nfr08_counts, dict) else {}
          nfr08_debuggers = nfr08.get("debugger_indicators") if nfr08 else None
          nfr08_dumps = nfr08.get("dump_indicators") if nfr08 else None
          nfr08_timed_out = nfr08.get("timed_out") if nfr08 else None
          nfr08_value = (
              f"reader {number(nfr08_counts.get('reader'))}; "
              f"input-state {number(nfr08_counts.get('input_state'))}; "
              f"debugger {len(nfr08_debuggers) if isinstance(nfr08_debuggers, list) else 'unavailable'}; "
              f"dump {len(nfr08_dumps) if isinstance(nfr08_dumps, list) else 'unavailable'}; "
              f"timed out {nfr08_timed_out if isinstance(nfr08_timed_out, bool) else 'unavailable'}"
          )
          nfr08_limit = (
              f"{number(nfr08.get('required_input_count_per_target')) if nfr08 else 'unavailable'} each; "
              "0 debugger/dump; no timeout"
          )

          nfr09 = operation("nfr-09.json", "nfr09_coverage")
          new_code = nfr09.get("new_code") if nfr09 else None
          new_code = new_code if isinstance(new_code, dict) else {}
          nfr09_value = (
              f"overall {number(nfr09.get('overall_expression_percent')) if nfr09 else 'unavailable'}%; "
              f"new code {number(new_code.get('line_percent'))}% "
              f"({number(new_code.get('covered_lines'))}/{number(new_code.get('executable_added_lines'))} lines)"
          )
          nfr09_limit = (
              f"overall ≥{number(nfr09.get('overall_minimum_percent')) if nfr09 else 'unavailable'}%; "
              f"new code ≥{number(new_code.get('minimum_percent'))}%"
          )

          e02 = read_report("e02-history-startup.json")
          e02_summary = e02.get("summary") if e02 else None
          e02_summary = e02_summary if isinstance(e02_summary, dict) else {}
          e02_sample_rows = e02.get("samples") if e02 else None
          e02_sample_rows = e02_sample_rows if isinstance(e02_sample_rows, list) else []
          e02_sample_count = e02_summary.get("sample_count")
          e02_median = e02_summary.get("target_median_ms")
          e02_threshold_value = e02_summary.get("criterion_threshold_ms")
          e02_measured = e02 is not None and e02.get("status") == "measured"

          def verifies_e02_history(sample):
              if not isinstance(sample, dict):
                  return False
              arms = sample.get("arms")
              if not isinstance(arms, dict):
                  return False
              target = arms.get("target")
              if not isinstance(target, dict):
                  return False
              history = target.get("history_load_verification")
              if not isinstance(history, dict):
                  return False
              return (
                  history.get("all_records_loaded_once") is True
                  and history.get("loaded_record_count") == 10_000
                  and history.get("expected_record_count") == 10_000
                  and history.get("missing_record_count") == 0
                  and history.get("duplicate_record_count") == 0
              )

          e02_verified_samples = sum(1 for sample in e02_sample_rows if verifies_e02_history(sample))
          e02_sample_count_valid = (
              isinstance(e02_sample_count, int)
              and not isinstance(e02_sample_count, bool)
              and e02_sample_count == 30
              and e02.get("warmup_count") == 3
              and e02_sample_count == e02.get("sample_count")
              and e02_sample_count == len(e02_sample_rows)
          )
          e02_history_valid = (
              e02_sample_count_valid
              and e02_verified_samples == e02_sample_count
          )
          e02_measurement_valid = (
              e02_measured
              and e02_sample_count_valid
              and isinstance(e02_median, (int, float))
              and isinstance(e02_threshold_value, (int, float))
          )
          if not e02_measurement_valid:
              e02_status = "ERROR"
          elif e02_summary.get("threshold_passed") is True and e02_history_valid:
              e02_status = "PASS"
          else:
              e02_status = "FAIL"
          e02_value = (
              f"{number(e02_median)} ms median; "
              f"{e02_verified_samples}/{number(e02_sample_count)} samples verified all 10,000 records once"
          )
          e02_threshold = f"≤ {number(e02_threshold_value)} ms"
          e02_samples = number(e02_sample_count)

          selected_nfrs = set(os.environ["NFR_SELECTION"].split(","))
          with summary.open("a", encoding="utf-8") as stream:
              if os.environ["NFR_ALL"] == "true":
                  stream.write(
                      "\n## NFR-08 and NFR-09\n\n"
                      "| NFR | Measurement | Threshold | Result |\n"
                      "|---|---|---|---|\n"
                      f"| NFR-08 | {nfr08_value} | {nfr08_limit} | **{status(nfr08)}** |\n"
                      f"| NFR-09 | {nfr09_value} | {nfr09_limit} | **{status(nfr09)}** |\n"
                      "\n## E02 startup with 10,000 history records\n\n"
                      "| Measurement | Threshold | Samples | Status |\n"
                      "|---|---:|---:|---|\n"
                      f"| {e02_value} | {e02_threshold} | {e02_samples} | **{e02_status}** |\n"
                  )
              else:
                  selected_rows = []
                  if "08" in selected_nfrs:
                      selected_rows.append(
                          f"| NFR-08 | {nfr08_value} | {nfr08_limit} | **{status(nfr08)}** |"
                      )
                  if "09" in selected_nfrs:
                      selected_rows.append(
                          f"| NFR-09 | {nfr09_value} | {nfr09_limit} | **{status(nfr09)}** |"
                      )
                  if selected_rows:
                      stream.write(
                          "\n## Selected NFR results\n\n"
                          "| NFR | Measurement | Threshold | Result |\n"
                          "|---|---|---|---|\n"
                          + "\n".join(selected_rows)
                          + "\n"
                      )
          PY
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw measurements and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nshell-performance-${{ matrix.system }}
          path: ${{ runner.temp }}/nshell-nfr-results
          if-no-files-found: warn
          retention-days: 90
