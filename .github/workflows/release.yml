name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-13
            target: x86_64-darwin
          - os: macos-14
            target: aarch64-darwin
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - uses: cachix/cachix-action@v17
        if: ${{ env.CACHIX_AUTH_TOKEN != '' }}
        with:
          name: takeokunn-nshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build release binary
        run: nix build --print-build-logs

      - name: Verify release binary starts
        run: |
          echo 'echo nshell-ci-ok' | ./result/bin/nshell | grep -q nshell-ci-ok

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          ref="${RELEASE_REF}"
          name="nshell-${ref}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp result/bin/nshell "dist/${name}/"
          cp README.md LICENSE man/nshell.1 "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
