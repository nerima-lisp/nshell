name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      commit-sha: ${{ steps.release-ref.outputs.commit-sha }}
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: release-ref
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be strict SemVer vMAJOR.MINOR.PATCH: $RELEASE_REF" >&2
            exit 1
          fi
          tag_ref="refs/tags/$RELEASE_REF"
          git show-ref --verify --quiet "$tag_ref" || {
            echo "::error::Release tag does not exist: $RELEASE_REF" >&2
            exit 1
          }
          commit_sha="$(git rev-parse "$tag_ref^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$commit_sha" ]]; then
            echo "::error::Checked-out commit does not match $RELEASE_REF" >&2
            exit 1
          fi
          echo "commit-sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches .asd version
        env:
          PACKAGE: nshell
        run: |
          set -euo pipefail
          tag_version="${RELEASE_REF#v}"
          mapfile -t asd_versions < <(perl -ne 'print "$1\n" if /^\s*:version "([^"]*)"/' "$PACKAGE.asd")
          if [[ "${#asd_versions[@]}" -eq 0 ]]; then
            echo "::error::Could not read :version from $PACKAGE.asd" >&2
            exit 1
          fi
          for asd_version in "${asd_versions[@]}"; do
            if [[ "$asd_version" != "$tag_version" ]]; then
              echo "::error::Tag $RELEASE_REF does not match $PACKAGE.asd version $asd_version" >&2
              exit 1
            fi
          done

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs

  integration:
    name: Test the tagged tree with real PTYs
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit-sha }}
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run full test suite
        env:
          HOME: ${{ runner.temp }}/nshell-home
          XDG_CACHE_HOME: ${{ runner.temp }}/nshell-cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/nshell-config
          XDG_STATE_HOME: ${{ runner.temp }}/nshell-state
          NSHELL_AI_COMMAND: /nonexistent
          NSHELL_TEST_PTY: "1"
        run: nix develop -c sbcl --script run-tests.lisp

  release:
    name: build and publish x86_64-linux
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Create the GitHub Release and upload its assets.
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit-sha }}
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake on native platform
        run: nix flake check --print-build-logs

      - name: Build release bundle
        run: nix build .#releaseBundle --print-build-logs

      - name: Verify release bundle
        run: perl scripts/verify-release-bundle.pl result

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          name="nshell-${RELEASE_REF}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp -R result/. "dist/${name}/"
          package() {
            output="$1"
            # The positional parameters are expanded by the inner bash.
            # shellcheck disable=SC2016
            nix shell --inputs-from . nixpkgs#gnutar nixpkgs#gzip --command bash -euo pipefail -c '
              tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner \
                -cf - -C dist "$1" | gzip -n > "$2"
            ' bash "${name}" "$output"
          }
          package "dist/${name}.tar.gz"
          package "dist/${name}.repro.tar.gz"
          cmp "dist/${name}.tar.gz" "dist/${name}.repro.tar.gz"
          rm "dist/${name}.repro.tar.gz"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      # Publish only after the maintainer supplies user-facing release notes.
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
