name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the release once, before any binary is built. Splitting this out of
  # the matrix means the org invariants are checked a single time rather than
  # once per target, and a mismatch fails before spending three SBCL image
  # builds on a release that must not be published.
  verify:
    name: Verify the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. Without this gate the two drift
      # silently, which is how cl-boundary-kit reached :version 1.0.0 while its
      # newest tag was still v0.6.0.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: nshell
        run: |
          set -euo pipefail
          asd_version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${RELEASE_REF#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $RELEASE_REF does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Check flake
        run: nix flake check --print-build-logs

  release:
    # One tarball, for the one platform `systems` declares. The matrix that used
    # to sit here carried a macos-14 (aarch64-darwin) leg; the 2026-08-01
    # revision reduced `systems` to x86_64-linux alone, so `nix build` on macOS
    # would now fail on a missing attribute. A one-element matrix is deleted
    # rather than left in place — it signals an intent to add a platform, and
    # there is none. See PACKAGE_STANDARD.md "CI の粒度".
    name: build and publish x86_64-linux
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Create the GitHub Release and upload its assets.
    env:
      RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE || 'takeokunn-nshell' }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build release binary
        run: nix build --print-build-logs

      - name: Verify release binary starts
        run: |
          echo 'echo nshell-ci-ok' | ./result/bin/nshell | grep -q nshell-ci-ok

      - name: Package tarball + checksum
        run: |
          set -euo pipefail
          name="nshell-${RELEASE_REF}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp result/bin/nshell "dist/${name}/"
          cp README.md LICENSE man/nshell.1 "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      # Creates the release as an empty draft, with the tarball and checksum
      # attached. This workflow does not produce a release body at all.
      #
      # As of the 2026-08-01 revision the GitHub Release description is the only
      # canonical changelog in this org; there is no CHANGELOG.md to read from.
      # See RELEASE_STANDARD.md. After this job goes green the maintainer fills
      # the body in and publishes:
      #
      #   gh release edit "$RELEASE_REF" --notes-file <file> --draft=false
      #
      # `draft: true` is load-bearing. Publishing straight away would make "the
      # maintainer forgot the notes" a user-visible state. A draft appears
      # neither under "Latest release" nor in the default output of
      # `gh release list`, so an unfinished release never reaches downstream.
      #
      # `generate_release_notes` is deliberately left off. Generated notes are a
      # list of commit titles and PR numbers, and RELEASE_STANDARD.md requires
      # the notes to be selected by "does a user of this package have to change
      # their own code" — a judgement no generator can make.
      #
      # Every `uses:` in this org references a 40-character SHA, never a mutable
      # tag. Re-resolve before bumping, and do not copy a SHA you have not
      # resolved yourself:
      #   gh api repos/softprops/action-gh-release/git/ref/tags/v2 --jq .object.sha
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
